<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Currency Converter</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to right, #1a73e8, #66bb6a);
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    .converter-box {
      background: #fff;
      color: #333;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    select, input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #1a73e8;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0c54b8;
    }

    h2 {
      color: #1a73e8;
    }

    .result {
      font-size: 18px;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="converter-box">
    <h2>💱 Live Currency Converter</h2>

    <input type="number" id="amount" placeholder="Enter amount" />

    <select id="fromCurrency"></select>
    <select id="toCurrency"></select>

    <button onclick="convertCurrency()">Convert</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");
    const result = document.getElementById("result");

    // All currency codes
    const currencyCodes = [
      "USD","EUR","INR","GBP","JPY","AUD","CAD","CHF","CNY","SGD","NZD",
      "ZAR","HKD","SEK","KRW","NOK","RUB","MXN","BRL","THB","AED","SAR",
      "DKK","PLN","TRY","IDR","MYR","PHP","PKR","EGP","NGN","BDT","VND"
    ];

    // Populate dropdowns
    currencyCodes.forEach(code => {
      const option1 = document.createElement("option");
      const option2 = document.createElement("option");
      option1.value = option2.value = code;
      option1.textContent = option2.textContent = code;
      fromCurrency.appendChild(option1);
      toCurrency.appendChild(option2);
    });

    fromCurrency.value = "USD";
    toCurrency.value = "INR";

    async function convertCurrency() {
      const amount = document.getElementById("amount").value;
      if (!amount || amount <= 0) {
        result.textContent = "Please enter a valid amount!";
        return;
      }

      const from = fromCurrency.value;
      const to = toCurrency.value;

      // Free API for real-time conversion
      const url = `https://api.exchangerate-api.com/v4/latest/${from}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const rate = data.rates[to];
        const converted = (amount * rate).toFixed(2);

        result.textContent = `${amount} ${from} = ${converted} ${to}`;
      } catch (error) {
        result.textContent = "Error fetching exchange rates!";
      }
    }
  </script>
</body>
</html>
